<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Informe</title>

</head>

<body>



    <h1>Informe</h1>



    <h2>Lista no ordenada</h2>

    <ul>

        <li>Matemáticas</li>

        <li>Física</li>

        <li>Química</li>

        <li>Informática</li>

    </ul>



    <h2>Lista ordenada</h2>

    <ol>

        <li>Introducción</li>

        <li>Desarrollo</li>

        <li>Resultados</li>

        <li>Conclusión</li>

    </ol>



    <h2>Tabla de cuatro columnas</h2>

    <table border="1">

        <tr>

            <th>Nombre</th>

            <th>Edad</th>

            <th>Grado</th>

            <th>Nota</th>

        </tr>

        <tr>

            <td>Juan</td>

            <td>15</td>

            <td>10°</td>

            <td>4.5</td>

        </tr>

        <tr>

            <td>María</td>

            <td>16</td>

            <td>10°</td>

            <td>4.8</td>

        </tr>

    </table>



    <h2>Registro</h2>



    <form>

        <label>Nombre:</label>

        <input type="text" name="nombre">

        <br><br>



        <label>Correo:</label>

        <input type="email" name="correo">

        <br><br>



        <label>Contraseña:</label>

        <input type="password" name="contrasena">

        <br><br>



        <input type="submit" value="Registrarse">

    </form>



</body>

</html>
